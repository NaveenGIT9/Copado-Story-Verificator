<template>
    <lightning-quick-action-panel header="Verify story">
        <template lwc:if={errorText}>
            <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_small" role="alert" data-id="error">
                <span>{errorText}</span>
            </div>
        </template>

        <template lwc:if={showIntro}>
            <div data-id="intro">
                <p class="slds-m-bottom_small" data-id="intro-text">{introText}</p>
                <ul class="slds-list_dotted slds-m-bottom_small" data-id="intro-list">
                    <li data-id="intro-item">Unregistered commits</li>
                    <li data-id="intro-item">Metadata coverage</li>
                    <li data-id="intro-item">Pull request approval</li>
                    <li data-id="intro-item">Pending tests</li>
                    <li data-id="intro-item">Parent story dependencies (and which environment the parent is in)</li>
                    <li data-id="intro-item">Org/environment branch merge into the feature branch</li>
                </ul>
            </div>
        </template>

        <template lwc:if={showRun}>
            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                <template lwc:if={showSpinner}>
                    <span class="spinner-holder slds-m-right_x-small" data-id="state-spinner">
                        <lightning-spinner size="x-small" alternative-text="Verification in progress"></lightning-spinner>
                    </span>
                </template>
                <p class={stateClass} aria-live="polite" data-id="state"><span class="state-key" data-id="state-key">{stateKey}</span><span class="step-colon" data-id="state-colon">{stateColon}</span><span class={stateValueClass} data-id="state-value">{stateValue}</span></p>
            </div>

            <ul class="slds-m-bottom_small" data-id="steps">
                <template for:each={steps} for:item="step">
                    <li key={step.key} class="slds-p-vertical_xx-small" data-id="step">
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <template lwc:if={step.isSpinner}>
                                <span class="spinner-holder slds-m-right_x-small">
                                    <lightning-spinner size="x-small" alternative-text={step.altText}></lightning-spinner>
                                </span>
                            </template>
                            <template lwc:else>
                                <span class="step-icon slds-m-right_x-small">
                                    <lightning-icon
                                        icon-name={step.iconName}
                                        variant={step.iconVariant}
                                        size="x-small"
                                        alternative-text={step.altText}
                                    ></lightning-icon>
                                </span>
                            </template>
                            <span class={step.textClass} data-id="step-text"><span class="step-key" data-id="step-key">{step.keyText}</span><span class="step-colon" data-id="step-colon">{step.colonText}</span>{step.valueText}</span>
                            <template lwc:if={step.hasLines}>
                                <button
                                    type="button"
                                    class="slds-button slds-m-left_x-small"
                                    aria-expanded={step.ariaExpanded}
                                    data-id="toggle"
                                    data-check-id={step.checkId}
                                    onclick={handleToggle}
                                >
                                    {step.toggleLabel}
                                </button>
                            </template>
                        </div>
                        <template lwc:if={step.expanded}>
                            <ul class="check-lines slds-text-body_small slds-m-left_xx-large" data-id="check-lines">
                                <template for:each={step.lines} for:item="checkLine">
                                    <li key={checkLine.key} class={checkLine.cssClass}>
                                        <template lwc:if={checkLine.isCommit}>
                                            <span class="c-bullet" data-id="c-bullet" aria-hidden="true"></span>
                                            <span class="c-sha" data-id="c-sha">{checkLine.sha}</span>
                                            <span class="c-author" data-id="c-author">{checkLine.author}</span>
                                            <span class="c-subject" data-id="c-subject">{checkLine.subject}</span>
                                            <template lwc:if={checkLine.hasNote}>
                                                <span class="c-note" data-id="c-note">{checkLine.note}</span>
                                            </template>
                                        </template>
                                        <template lwc:elseif={checkLine.isDanger}>
                                            <lightning-icon
                                                icon-name="utility:warning"
                                                variant="error"
                                                size="x-small"
                                                alternative-text="Warning"
                                                class="slds-m-right_x-small"
                                            ></lightning-icon>
                                            <span data-id="danger-text">{checkLine.text}</span>
                                        </template>
                                        <template lwc:elseif={checkLine.isGroup}>
                                            <button
                                                type="button"
                                                class="group-toggle slds-button"
                                                aria-expanded={checkLine.ariaExpanded}
                                                title={checkLine.toggleTitle}
                                                data-id="group-toggle"
                                                data-group-key={checkLine.groupKey}
                                                onclick={handleGroupToggle}
                                            >
                                                <lightning-icon
                                                    icon-name={checkLine.chevron}
                                                    size="xx-small"
                                                    alternative-text={checkLine.toggleTitle}
                                                    class="slds-m-right_xx-small"
                                                ></lightning-icon>
                                                <span class={checkLine.labelClass} data-id="group-label">{checkLine.label}</span>
                                            </button>
                                            <template lwc:if={checkLine.open}>
                                                <ul class="group-items" data-id="group-items">
                                                    <template for:each={checkLine.entries} for:item="entry">
                                                        <li key={entry.key} class={entry.cssClass}>{entry.text}</li>
                                                    </template>
                                                </ul>
                                            </template>
                                        </template>
                                        <template lwc:else>{checkLine.text}</template>
                                    </li>
                                </template>
                            </ul>
                        </template>
                    </li>
                </template>
            </ul>

            <template lwc:if={isFinished}>
                <template lwc:if={failureText}>
                    <div class="slds-box slds-box_small slds-theme_error slds-m-top_small failure-text" role="alert" data-id="failure">
                        {failureText}
                    </div>
                </template>
                <p class="slds-text-align_right slds-text-color_weak slds-m-top_small" data-id="time-taken">{timeTakenText}</p>
            </template>
        </template>

        <div slot="footer">
            <lightning-button class="slds-m-right_x-small" label="Close" onclick={handleClose} data-id="close"></lightning-button>
            <template lwc:if={showIntro}>
                <lightning-button variant="brand" label="Verify" onclick={handleVerify} data-id="verify"></lightning-button>
            </template>
            <template lwc:if={canRetry}>
                <lightning-button variant="brand" label="Verify again" onclick={handleRetry} data-id="retry"></lightning-button>
            </template>
        </div>
    </lightning-quick-action-panel>
</template>
