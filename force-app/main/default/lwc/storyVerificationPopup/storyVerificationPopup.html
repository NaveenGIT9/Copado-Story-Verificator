<template>
    <lightning-quick-action-panel header="Verify story">
        <template lwc:if={errorText}>
            <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_small" role="alert" data-id="error">
                <span>{errorText}</span>
            </div>
        </template>

        <template lwc:if={metaError}>
            <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_small" role="alert" data-id="meta-error">
                <span>{metaError}</span>
            </div>
        </template>

        <template lwc:if={showIntro}>
            <div data-id="intro">
                <p class="slds-m-bottom_small" data-id="intro-text">{introText}</p>
                <ul class="slds-list_dotted slds-m-bottom_small" data-id="intro-list">
                    <li data-id="intro-item">Unregistered commits</li>
                    <li data-id="intro-item">Metadata coverage</li>
                    <li data-id="intro-item">Pull request approval</li>
                    <li data-id="intro-item">Pending tests</li>
                    <li data-id="intro-item">Parent story dependencies (and which environment the parent is in)</li>
                    <li data-id="intro-item">Org/environment branch merge into the feature branch</li>
                </ul>
            </div>
        </template>

        <template lwc:if={showRun}>
            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                <template lwc:if={showSpinner}>
                    <span class="spinner-holder slds-m-right_x-small" data-id="state-spinner">
                        <lightning-spinner size="x-small" alternative-text="Verification in progress"></lightning-spinner>
                    </span>
                </template>
                <p class={stateClass} aria-live="polite" data-id="state"><span class="state-key" data-id="state-key">{stateKey}</span><span class="step-colon" data-id="state-colon">{stateColon}</span><span class={stateValueClass} data-id="state-value">{stateValue}</span></p>
            </div>

            <ul class="slds-m-bottom_small" data-id="steps">
                <template for:each={steps} for:item="step">
                    <li key={step.key} class="slds-p-vertical_xx-small" data-id="step">
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <template lwc:if={step.isSpinner}>
                                <span class="spinner-holder slds-m-right_x-small">
                                    <lightning-spinner size="x-small" alternative-text={step.altText}></lightning-spinner>
                                </span>
                            </template>
                            <template lwc:else>
                                <span class="step-icon slds-m-right_x-small">
                                    <lightning-icon
                                        icon-name={step.iconName}
                                        variant={step.iconVariant}
                                        size="x-small"
                                        alternative-text={step.altText}
                                    ></lightning-icon>
                                </span>
                            </template>
                            <span class={step.textClass} data-id="step-text"><span class="step-key" data-id="step-key">{step.keyText}</span><span class="step-colon" data-id="step-colon">{step.colonText}</span>{step.valueText}</span>
                            <template lwc:if={step.hasLines}>
                                <button
                                    type="button"
                                    class="slds-button slds-m-left_x-small"
                                    aria-expanded={step.ariaExpanded}
                                    data-id="toggle"
                                    data-check-id={step.checkId}
                                    onclick={handleToggle}
                                >
                                    {step.toggleLabel}
                                </button>
                            </template>
                        </div>
                        <template lwc:if={step.expanded}>
                            <ul class="check-lines slds-text-body_small slds-m-left_xx-large" data-id="check-lines">
                                <template for:each={step.lines} for:item="checkLine">
                                    <li key={checkLine.key} class={checkLine.cssClass}>
                                        <template lwc:if={checkLine.isCommit}>
                                            <span class="c-bullet" data-id="c-bullet" aria-hidden="true"></span>
                                            <template lwc:if={checkLine.hasLink}>
                                                <a
                                                    class="c-link"
                                                    href={checkLine.href}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    title={checkLine.linkTitle}
                                                    data-id="c-link"
                                                >
                                                    <span class="c-sha" data-id="c-sha">{checkLine.sha}</span>
                                                    <lightning-icon
                                                        icon-name="utility:new_window"
                                                        size="xx-small"
                                                        alternative-text="Opens in a new tab"
                                                        class="slds-m-left_xx-small"
                                                    ></lightning-icon>
                                                </a>
                                            </template>
                                            <template lwc:else>
                                                <span class="c-sha" data-id="c-sha">{checkLine.sha}</span>
                                            </template>
                                            <span class="c-author" data-id="c-author">{checkLine.author}</span>
                                            <span class="c-subject" data-id="c-subject">{checkLine.subject}</span>
                                            <template lwc:if={checkLine.hasNote}>
                                                <span class="c-note" data-id="c-note">{checkLine.note}</span>
                                            </template>
                                        </template>
                                        <template lwc:elseif={checkLine.isDanger}>
                                            <lightning-icon
                                                icon-name="utility:warning"
                                                variant="error"
                                                size="x-small"
                                                alternative-text="Warning"
                                                class="slds-m-right_x-small"
                                            ></lightning-icon>
                                            <span data-id="danger-text">{checkLine.text}</span>
                                            <template lwc:if={checkLine.hasAction}>
                                                <lightning-button
                                                    class="slds-m-left_medium"
                                                    variant="brand"
                                                    label="Create Selected Metadata"
                                                    onclick={handleCreateSelected}
                                                    disabled={busy}
                                                    data-id="create-selected"
                                                ></lightning-button>
                                            </template>
                                        </template>
                                        <template lwc:elseif={checkLine.isGroup}>
                                            <button
                                                type="button"
                                                class="group-toggle slds-button"
                                                aria-expanded={checkLine.ariaExpanded}
                                                title={checkLine.toggleTitle}
                                                data-id="group-toggle"
                                                data-group-key={checkLine.groupKey}
                                                onclick={handleGroupToggle}
                                            >
                                                <lightning-icon
                                                    icon-name={checkLine.chevron}
                                                    size="xx-small"
                                                    alternative-text={checkLine.toggleTitle}
                                                    class="slds-m-right_xx-small"
                                                ></lightning-icon>
                                                <span class={checkLine.labelClass} data-id="group-label">{checkLine.label}</span>
                                            </button>
                                            <template lwc:if={checkLine.open}>
                                                <ul class="group-items" data-id="group-items">
                                                    <template for:each={checkLine.entries} for:item="entry">
                                                        <li key={entry.key} class={entry.cssClass}>{entry.text}</li>
                                                    </template>
                                                </ul>
                                            </template>
                                        </template>
                                        <template lwc:elseif={checkLine.isSelect}>
                                            <button
                                                type="button"
                                                class="group-toggle slds-button"
                                                aria-expanded={checkLine.ariaExpanded}
                                                title={checkLine.toggleTitle}
                                                data-id="group-toggle"
                                                data-group-key={checkLine.groupKey}
                                                onclick={handleGroupToggle}
                                            >
                                                <lightning-icon
                                                    icon-name={checkLine.chevron}
                                                    size="xx-small"
                                                    alternative-text={checkLine.toggleTitle}
                                                    class="slds-m-right_xx-small"
                                                ></lightning-icon>
                                                <span class={checkLine.labelClass} data-id="group-label">{checkLine.label}</span>
                                            </button>
                                            <template lwc:if={checkLine.open}>
                                                <ul class="group-items select-items" data-id="select-items">
                                                    <template lwc:if={checkLine.showAll}>
                                                        <li class="select-all" data-id="select-all-row">
                                                            <label>
                                                                <input
                                                                    type="checkbox"
                                                                    class="select-box"
                                                                    checked={checkLine.allChecked}
                                                                    data-scope="all"
                                                                    data-indeterminate={checkLine.allIndeterminate}
                                                                    data-id="select-all"
                                                                    onchange={handleSelectChange}
                                                                />
                                                                <span class="select-label">Select all</span>
                                                            </label>
                                                        </li>
                                                    </template>
                                                    <template for:each={checkLine.entries} for:item="entry">
                                                        <li key={entry.key} class={entry.cssClass} title={entry.title}>
                                                            <template lwc:if={entry.showBox}>
                                                                <input
                                                                    type="checkbox"
                                                                    class="select-box"
                                                                    checked={entry.checked}
                                                                    disabled={entry.disabled}
                                                                    aria-label={entry.ariaLabel}
                                                                    data-scope={entry.scope}
                                                                    data-kind={entry.kind}
                                                                    data-key={entry.itemKey}
                                                                    data-indeterminate={entry.indeterminate}
                                                                    data-id="select-box"
                                                                    onchange={handleSelectChange}
                                                                />
                                                            </template>
                                                            <span data-id="select-text">{entry.text}</span>
                                                            <template lwc:if={entry.action}>
                                                                <span class={entry.actionClass} data-id="action-badge">{entry.action}</span>
                                                            </template>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </template>
                                        </template>
                                        <template lwc:else>{checkLine.text}</template>
                                    </li>
                                </template>
                            </ul>
                        </template>
                    </li>
                </template>
            </ul>

            <template lwc:if={isFinished}>
                <template lwc:if={failureText}>
                    <div class="slds-box slds-box_small slds-theme_error slds-m-top_small failure-text" role="alert" data-id="failure">
                        {failureText}
                    </div>
                </template>
                <p class="slds-text-align_right slds-text-color_weak slds-m-top_small" data-id="time-taken">{timeTakenText}</p>
            </template>
        </template>

        <template lwc:if={showPreview}>
            <div data-id="preview">
                <p class="slds-m-bottom_x-small" data-id="preview-intro">
                    These records will be created under <strong>User Story Metadata</strong> of the story
                    <strong data-id="preview-story">{previewStoryLabel}</strong>:
                </p>
                <p class="slds-text-color_weak slds-m-bottom_small" data-id="preview-summary">{previewSummary}</p>
                <template for:each={previewSections} for:item="section">
                    <div key={section.key} class="preview-section" data-id="preview-section">
                        <p class="preview-type" data-id="preview-type">{section.typeLabel}</p>
                        <ul class="preview-lines">
                            <template for:each={section.lines} for:item="line">
                                <li key={line.key} class={line.cssClass} data-id="preview-line">
                                    <span class="component-name" data-id="preview-name">{line.name}</span>
                                    <span class={line.actionClass} data-id="preview-action">{line.action}</span>
                                    <template lwc:if={line.exists}>
                                        <span class="preview-note" data-id="preview-exists">already registered, skipped</span>
                                    </template>
                                    <template lwc:if={line.note}>
                                        <span class="preview-note" data-id="preview-adjusted">{line.note}</span>
                                    </template>
                                    <template lwc:if={line.conflict}>
                                        <span class="preview-conflict-note" data-id="preview-conflict">{line.conflict}</span>
                                    </template>
                                    <template lwc:if={line.path}>
                                        <span class="preview-path" data-id="preview-path">{line.path}</span>
                                    </template>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>
            </div>
        </template>

        <template lwc:if={showDone}>
            <div data-id="done">
                <p class="slds-m-bottom_small" data-id="done-summary">{doneSummary}</p>
                <template for:each={doneErrors} for:item="failure">
                    <p key={failure.key} class="slds-text-color_error" data-id="done-error">{failure.text}</p>
                </template>
                <p class="slds-text-color_weak slds-m-top_small">Click Verify again to refresh the result.</p>
            </div>
        </template>

        <div slot="footer">
            <template lwc:if={showPreview}>
                <lightning-button class="slds-m-right_x-small" label="Back" onclick={handleBack} disabled={busy} data-id="back"></lightning-button>
                <lightning-button variant="brand" label={insertLabel} onclick={handleInsert} disabled={insertDisabled} data-id="insert"></lightning-button>
            </template>
            <lightning-button class="slds-m-right_x-small" label="Close" onclick={handleClose} data-id="close"></lightning-button>
            <template lwc:if={showIntro}>
                <lightning-button variant="brand" label="Verify" onclick={handleVerify} data-id="verify"></lightning-button>
            </template>
            <template lwc:if={canRetry}>
                <lightning-button variant="brand" label="Verify again" onclick={handleRetry} data-id="retry"></lightning-button>
            </template>
        </div>
    </lightning-quick-action-panel>
</template>
