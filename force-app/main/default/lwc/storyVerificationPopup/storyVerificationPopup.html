<template>
    <lightning-quick-action-panel>
        <div class="sv">
        <div class="sv-head" data-id="sv-head">
            <h2 class="sv-heading">Copado Story Readiness</h2>
            <template lwc:if={showStoryInfo}>
                <div class="story-info" data-id="story-info">
                    <div class="story-name" data-id="story-name">{storyName}</div>
                    <template lwc:if={baseBranch}>
                        <div class="story-base" data-id="story-base"><span class="story-base-key">Base branch</span><span class="step-colon">:</span><span class="story-base-value">{baseBranch}</span></div>
                    </template>
                </div>
            </template>
        </div>
        <div class="sv-body">
        <template lwc:if={gateDisabled}>
            <div class="slds-notify slds-notify_alert slds-alert_offline slds-m-bottom_small" role="status" data-id="gate-disabled">
                <span>Story verification gate is turned off org-wide. Results are for information only and will not block promotion.</span>
            </div>
        </template>
        <template lwc:if={errorText}>
            <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_small" role="alert" data-id="error">
                <span>{errorText}</span>
            </div>
        </template>
        <template lwc:if={runningElsewhere}>
            <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small" role="alert" data-id="running-elsewhere">
                <span class="slds-m-right_small">An earlier verification of this story is still running.</span>
                <lightning-button label="Cancel" onclick={handleCancel} disabled={cancelling} data-id="cancel-earlier"></lightning-button>
            </div>
        </template>

        <template lwc:if={metaError}>
            <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_small" role="alert" data-id="meta-error">
                <span>{metaError}</span>
            </div>
        </template>

        <template lwc:if={showIntro}>
            <div class="sv-intro" data-id="intro">
                <p class="intro-text" data-id="intro-text">{introText}</p>
                <ul class="intro-list" data-id="intro-list">
                    <li data-id="intro-item">Unregistered commits</li>
                    <li data-id="intro-item">Metadata coverage</li>
                    <li data-id="intro-item">Pull request approval</li>
                    <li data-id="intro-item">Pending tests</li>
                    <li data-id="intro-item">Parent story dependencies (and which environment the parent is in)</li>
                    <li data-id="intro-item">External branches merged into the feature branch (environment, promotion or other feature branches)</li>
                </ul>
            </div>
        </template>

        <template lwc:if={showRun}>
            <div class="sv-status" data-id="status-pill">
                <span class="state-slot">
                    <template lwc:if={showSpinner}>
                        <span class="state-orbit" role="img" aria-label="Verification in progress" data-id="state-spinner">
                            <span class="orbit" aria-hidden="true"><i></i><i></i><i></i></span>
                        </span>
                    </template>
                    <template lwc:elseif={showsVerdict}>
                        <span class={stateMarkClass} aria-hidden="true" data-id="state-mark"></span>
                    </template>
                </span>
                <p class={stateClass} aria-live="polite" data-id="state"><span class="state-key" data-id="state-key">{stateKey}</span><span class="step-colon" data-id="state-colon">{stateColon}</span><span class={stateValueClass} data-id="state-value">{stateValue}</span></p>
            </div>

            <ul class="timeline" data-id="steps">
                <template for:each={steps} for:item="step">
                    <li key={step.key} class={step.itemClass} data-id="step">
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <template lwc:if={step.isSpinner}>
                                <span class="step-icon step-run" role="img" aria-label={step.altText} data-id="step-orbit">
                                    <span class="orbit" aria-hidden="true"><i></i><i></i><i></i></span>
                                </span>
                            </template>
                            <template lwc:else>
                                <span class="step-icon slds-m-right_x-small">
                                    <lightning-icon
                                        icon-name={step.iconName}
                                        variant={step.iconVariant}
                                        size="x-small"
                                        alternative-text={step.altText}
                                    ></lightning-icon>
                                </span>
                            </template>
                            <span class={step.textClass} data-id="step-text"><span class="step-key" data-id="step-key">{step.keyText}</span><span class="step-colon" data-id="step-colon">{step.colonText}</span><template lwc:if={step.hasParts}><template for:each={step.valueParts} for:item="part"><a key={part.key} lwc:if={part.isLink} class={part.cls} href={part.href} target="_blank" rel="noopener noreferrer" data-id="part-link">{part.text}</a><span key={part.key} lwc:else class={part.cls}>{part.text}</span></template></template><template lwc:else>{step.valueText}</template></span>
                            <template lwc:if={step.hasLines}>
                                <button
                                    type="button"
                                    class="slds-button slds-m-left_x-small"
                                    aria-expanded={step.ariaExpanded}
                                    data-id="toggle"
                                    data-check-id={step.checkId}
                                    onclick={handleToggle}
                                >
                                    {step.toggleLabel}
                                </button>
                            </template>
                        </div>
                        <template lwc:if={step.expanded}>
                            <ul class="check-lines slds-text-body_small slds-m-left_xx-large" data-id="check-lines">
                                <template for:each={step.lines} for:item="checkLine">
                                    <li key={checkLine.key} class={checkLine.cssClass}>
                                        <template lwc:if={checkLine.isCommit}>
                                            <span class="c-bullet" data-id="c-bullet" aria-hidden="true"></span>
                                            <template lwc:if={checkLine.hasLink}>
                                                <a
                                                    class="c-link"
                                                    href={checkLine.href}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    title={checkLine.linkTitle}
                                                    data-id="c-link"
                                                >
                                                    <span class="c-sha" data-id="c-sha">{checkLine.sha}</span>
                                                    <lightning-icon
                                                        icon-name="utility:new_window"
                                                        size="xx-small"
                                                        alternative-text="Opens in a new tab"
                                                        class="slds-m-left_xx-small"
                                                    ></lightning-icon>
                                                </a>
                                            </template>
                                            <template lwc:else>
                                                <span class="c-sha" data-id="c-sha">{checkLine.sha}</span>
                                            </template>
                                            <span class="c-author" data-id="c-author">{checkLine.author}</span>
                                            <span class="c-subject" data-id="c-subject">{checkLine.subject}</span>
                                            <template lwc:if={checkLine.hasNote}>
                                                <span class={checkLine.noteClass} data-id="c-note">{checkLine.note}</span>
                                            </template>
                                        </template>
                                        <template lwc:elseif={checkLine.isDanger}>
                                            <lightning-icon
                                                icon-name="utility:warning"
                                                size="x-small"
                                                alternative-text="Warning"
                                                class="danger-icon slds-m-right_x-small"
                                            ></lightning-icon>
                                            <span data-id="danger-text">{checkLine.text}</span>
                                            <template lwc:if={checkLine.hasAction}>
                                                <button
                                                    type="button"
                                                    class="slds-button sv-btn danger-action"
                                                    onclick={handleCreateSelected}
                                                    disabled={busy}
                                                    data-id="create-selected"
                                                >Create Selected Metadata</button>
                                            </template>
                                        </template>
                                        <template lwc:elseif={checkLine.isGroup}>
                                            <button
                                                type="button"
                                                class="group-toggle slds-button"
                                                aria-expanded={checkLine.ariaExpanded}
                                                title={checkLine.toggleTitle}
                                                data-id="group-toggle"
                                                data-group-key={checkLine.groupKey}
                                                onclick={handleGroupToggle}
                                            >
                                                <lightning-icon
                                                    icon-name={checkLine.chevron}
                                                    size="xx-small"
                                                    alternative-text={checkLine.toggleTitle}
                                                    class="slds-m-right_xx-small"
                                                ></lightning-icon>
                                                <span class={checkLine.labelClass} data-id="group-label">{checkLine.label}</span>
                                            </button>
                                            <template lwc:if={checkLine.open}>
                                                <ul class="group-items" data-id="group-items">
                                                    <template for:each={checkLine.entries} for:item="entry">
                                                        <li key={entry.key} class={entry.cssClass}>{entry.text}</li>
                                                    </template>
                                                </ul>
                                            </template>
                                        </template>
                                        <template lwc:elseif={checkLine.isSelect}>
                                            <div class="pick-head">
                                                <button
                                                    type="button"
                                                    class="group-toggle slds-button"
                                                    aria-expanded={checkLine.ariaExpanded}
                                                    title={checkLine.toggleTitle}
                                                    data-id="group-toggle"
                                                    data-group-key={checkLine.groupKey}
                                                    onclick={handleGroupToggle}
                                                >
                                                    <lightning-icon
                                                        icon-name={checkLine.chevron}
                                                        size="xx-small"
                                                        alternative-text={checkLine.toggleTitle}
                                                        class="pick-chevron slds-m-right_xx-small"
                                                    ></lightning-icon>
                                                    <span class={checkLine.labelClass} data-id="group-label">{checkLine.label}</span>
                                                </button>
                                                <template lwc:if={checkLine.showAll}>
                                                    <span class="pick-sum" data-id="select-summary"><b>{checkLine.ticked}</b> of {checkLine.selectable} selected</span>
                                                </template>
                                            </div>
                                            <template lwc:if={checkLine.open}>
                                                <div class="select-items" data-id="select-items">
                                                    <template lwc:if={checkLine.showAll}>
                                                        <label class="pick-all" data-id="select-all-row">
                                                            <input
                                                                type="checkbox"
                                                                class="select-box pick-switch pick-switch_lg"
                                                                checked={checkLine.allChecked}
                                                                data-scope="all"
                                                                data-indeterminate={checkLine.allIndeterminate}
                                                                data-id="select-all"
                                                                onchange={handleSelectChange}
                                                            />
                                                            <span class="pick-all-label">Select all</span>
                                                            <span class="pick-count"><b>{checkLine.ticked}</b> of {checkLine.selectable}</span>
                                                        </label>
                                                    </template>
                                                    <template for:each={checkLine.cards} for:item="card">
                                                        <div key={card.key} class={card.cardClass} title={card.title} data-id="select-type">
                                                            <label class="pick-type-head">
                                                                <template lwc:if={card.showBox}>
                                                                    <input
                                                                        type="checkbox"
                                                                        class="select-box pick-check"
                                                                        checked={card.checked}
                                                                        disabled={card.disabled}
                                                                        aria-label={card.ariaLabel}
                                                                        data-scope="group"
                                                                        data-kind={card.kind}
                                                                        data-indeterminate={card.indeterminate}
                                                                        data-id="select-box"
                                                                        onchange={handleSelectChange}
                                                                    />
                                                                </template>
                                                                <span class="pick-type-name" data-id="select-type-name">{card.text}</span>
                                                                <span class="pick-type-count">{card.countText}</span>
                                                            </label>
                                                            <ul class="pick-rows">
                                                                <template for:each={card.entries} for:item="entry">
                                                                    <li key={entry.key}>
                                                                        <label class={entry.rowClass} title={entry.title}>
                                                                            <span class="pick-name" data-id="select-text">{entry.text}</span>
                                                                            <span class="pick-action" data-id="action-badge">{entry.action}</span>
                                                                            <template lwc:if={entry.showBox}>
                                                                                <input
                                                                                    type="checkbox"
                                                                                    class="select-box pick-switch"
                                                                                    checked={entry.checked}
                                                                                    disabled={entry.disabled}
                                                                                    aria-label={entry.ariaLabel}
                                                                                    data-scope="item"
                                                                                    data-key={entry.itemKey}
                                                                                    data-indeterminate="false"
                                                                                    data-id="select-box"
                                                                                    onchange={handleSelectChange}
                                                                                />
                                                                            </template>
                                                                        </label>
                                                                    </li>
                                                                </template>
                                                            </ul>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </template>
                                        <template lwc:elseif={checkLine.hasParts}>
                                            <template for:each={checkLine.parts} for:item="part">
                                                <a key={part.key} lwc:if={part.isLink} class={part.cls} href={part.href} target="_blank" rel="noopener noreferrer" data-id="part-link">{part.text}</a>
                                                <span key={part.key} lwc:else class={part.cls}>{part.text}</span>
                                            </template>
                                        </template>
                                        <template lwc:else>{checkLine.text}</template>
                                    </li>
                                </template>
                            </ul>
                        </template>
                    </li>
                </template>
            </ul>

            <template lwc:if={isFinished}>
                <template lwc:if={failureText}>
                    <div class="failure-text" role="alert" data-id="failure">
                        {failureText}
                    </div>
                </template>
            </template>
        </template>

        <template lwc:if={showPreview}>
            <div data-id="preview">
                <p class="slds-m-bottom_x-small" data-id="preview-intro">
                    These records will be created under <strong>User Story Metadata</strong> of the story&nbsp;<strong data-id="preview-story">{previewStoryLabel}</strong>:
                </p>
                <p class="slds-text-color_weak slds-m-bottom_small" data-id="preview-summary">{previewSummary}</p>
                <template for:each={previewSections} for:item="section">
                    <div key={section.key} class="preview-section" data-id="preview-section">
                        <p class="preview-type" data-id="preview-type">{section.typeLabel}</p>
                        <ul class="preview-lines">
                            <template for:each={section.lines} for:item="line">
                                <li key={line.key} class={line.cssClass} data-id="preview-line">
                                    <span class="component-name" data-id="preview-name">{line.name}</span>
                                    <span class={line.actionClass} data-id="preview-action">{line.action}</span>
                                    <template lwc:if={line.exists}>
                                        <span class="preview-note" data-id="preview-exists">already registered, skipped</span>
                                    </template>
                                    <template lwc:if={line.note}>
                                        <span class="preview-note" data-id="preview-adjusted">{line.note}</span>
                                    </template>
                                    <template lwc:if={line.conflict}>
                                        <span class="preview-conflict-note" data-id="preview-conflict">{line.conflict}</span>
                                    </template>
                                    <template lwc:if={line.path}>
                                        <span class="preview-path" data-id="preview-path">{line.path}</span>
                                    </template>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>
            </div>
        </template>

        <template lwc:if={showDone}>
            <div data-id="done">
                <p class="slds-m-bottom_small" data-id="done-summary">{doneSummary}</p>
                <template for:each={doneErrors} for:item="failure">
                    <p key={failure.key} class="slds-text-color_error" data-id="done-error">{failure.text}</p>
                </template>
                <p class="slds-text-color_weak slds-m-top_small">Click Verify again to refresh the result.</p>
            </div>
        </template>
        </div>
        </div>

        <div slot="footer" class="sv-foot">
            <template lwc:if={showTimeTaken}>
                <p class="sv-time" data-id="time-taken">{timeTakenText}</p>
            </template>
            <template lwc:if={showPreview}>
                <lightning-button label="Back" onclick={handleBack} disabled={busy} data-id="back"></lightning-button>
                <button type="button" class="slds-button sv-btn" onclick={handleInsert} disabled={insertDisabled} data-id="insert">{insertLabel}</button>
            </template>
            <template lwc:if={canCancel}>
                <lightning-button label="Cancel" onclick={handleCancel} disabled={cancelling} data-id="cancel"></lightning-button>
            </template>
            <lightning-button label="Close" onclick={handleClose} data-id="close"></lightning-button>
            <template lwc:if={showIntro}>
                <button type="button" class="slds-button sv-btn" onclick={handleVerify} data-id="verify">Verify</button>
            </template>
            <template lwc:if={showRestart}>
                <button type="button" class="slds-button sv-btn" onclick={handleRestart} disabled={cancelling} data-id="restart">Verify again</button>
            </template>
            <template lwc:if={canRetry}>
                <button type="button" class="slds-button sv-btn" onclick={handleRetry} data-id="retry">Verify again</button>
            </template>
        </div>
    </lightning-quick-action-panel>
</template>
